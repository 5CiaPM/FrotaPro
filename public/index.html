<div class=card><h3>Manutenções por veículo</h3>${bars(Object.values(C).map(c=>[c.v.prefix,c.n]),fmt.n)}</div></div>`}
function costs(){const C=Object.values(stats()),by={};DB.orders.forEach(o=>{const p=LB.providers(DB.providers.find(x=>x.id==o.provider));by[p]=(by[p]||0)+(+o.total||0)});
return`<h2>Custos</h2><div class=grid style="margin:12px 0">${[['Combustível',sum(C,c=>c.fu)],['Manutenção',sum(C,c=>c.man)],['Seguros',sum(C,c=>c.se)],['Multas',sum(C,c=>c.mu)],['Total',sum(C,c=>c.t)]].map(c=>`<div class=card><span class=mut>${c[0]}</span><b class=n>${fmt.m(c[1])}</b></div>`).join('')}</div>
<div class="card tw"><h3>Por veículo</h3><table><tr><th>Veículo<th>Manutenção<th>Combustível<th>Seguro<th>Multas<th>Total<th>R$/km<th>km/l</tr>${C.map(c=>`<tr><td>${esc(LB.vehicles(c.v))}<td>${fmt.m(c.man)}<td>${fmt.m(c.fu)}<td>${fmt.m(c.se)}<td>${fmt.m(c.mu)}<td><b>${fmt.m(c.t)}</b><td>${fmt.m(c.cpk)}<td>${c.kml.toFixed(1)}</tr>`).join('')}</table></div>
<div class=card style="margin-top:12px"><h3>Custo de manutenção por prestador</h3>${bars(Object.entries(by))}</div>`}
function reports(){return`<h2>Relatórios</h2><p class=mut>Abra o relatório, copie o CSV para o Excel ou use “Imprimir / PDF” em qualquer tela.</p><div class=grid>${Object.keys(ST).filter(m=>m!='users').map(m=>`<div class=card><b>${ST[m].t}</b><p><button class="btn s" onclick="csv('${m}')">Ver CSV</button></p></div>`).join('')}</div><p><button class="btn g" onclick="print()">Imprimir / PDF</button></p>`}
function csv(m){const s=ST[m],c=s.c.map(k=>k=='#'?['#','Nº']:s.f.find(f=>f[0]==k)),q=v=>'"'+String(v).replace(/"/g,'""')+'"',t=[c.map(f=>q(f[1])).join(';'),...DB[m].map(r=>c.map(f=>q(tx(f,r))).join(';'))].join('\n');modal(`<h3>${s.t} — CSV</h3><textarea rows=12 readonly onfocus="this.select()">${esc(t)}</textarea><p><button class="btn" onclick="$('#dlg').close()">Fechar</button></p>`)}
function lst(m){const s=ST[m];return`<p class=mut>Início / ${esc(s.t)}</p><div class="bar np"><h2 style="flex:1">${esc(s.t)}</h2><input placeholder="Buscar…" value="${esc(Q[m]||'')}" oninput="Q['${m}']=this.value;$('#tw').innerHTML=tbl('${m}')" style="max-width:220px">${can('c')?`<button class=btn onclick="op('${m}')">+ Novo</button>`:''}<button class="btn g" onclick="csv('${m}')">Exportar CSV</button></div><div id=tw class=tw>${tbl(m)}</div>`}
function tbl(m){const s=ST[m],q=(Q[m]||'').toLowerCase(),c=s.c.map(k=>k=='#'?['#','Nº']:s.f.find(f=>f[0]==k)),R=DB[m].filter(r=>!q||c.map(f=>tx(f,r)).join(' ').toLowerCase().includes(q));
return`<div class=card style="padding:0"><table><tr>${c.map(f=>`<th>${f[1]}`).join('')}<th></tr>${R.map(r=>`<tr>${c.map(f=>`<td>${f[0]=='status'?`<span class=tag>${esc(tx(f,r))}</span>`:esc(tx(f,r))}`).join('')}<td><button class="btn g s" onclick="op('${m}',${r.id})">${can('e')?'Editar':'Ver'}</button> ${can('d')?`<button class="btn g s" onclick="dl('${m}',${r.id})">Excluir</button>`:''}</tr>`).join('')||`<tr><td colspan=9 class=mut>Nada por aqui. Use “+ Novo” para cadastrar.</tr>`}</table></div>`}
function fld(f,r){const[k,l,t,o,rq,fl]=f,v=r[k]??'',R=rq?' required':'';let i;
if(t=='s')i=`<select name=${k}${R}>${rq?'':'<option></option>'}${o.map(x=>`<option${x==v?' selected':''}>${esc(x)}</option>`).join('')}</select>`;
else if(t=='r')i=`<select name=${k}${R}${k=='vehicle'?' onchange="vf(this)"':''}><option value="">Selecionar…</option>${DB[o].filter(fl||(()=>1)).map(x=>`<option value=${x.id}${x.id==v?' selected':''}>${esc(LB[o](x))}</option>`).join('')}</select>`;
else if(t=='a')i=`<textarea name=${k} rows=3${R}>${esc(v)}</textarea>`;
else if(t=='c')i=`<input name=${k} readonly>`;
else i=`<input name=${k} type="${t=='d'?'date':t=='n'||t=='m'?'number':t=='p'?'password':'text'}"${t=='n'||t=='m'?' step=any':''} value="${t=='p'?'':esc(v)}"${R}>`;
return`<div class="${t=='a'?'wide':''}"><label>${l}${rq?' *':''}</label>${i}</div>`}
function vf(sel){const v=V(sel.value),f=sel.form,k=f.elements.kmOs||f.elements.kmF;if(v&&k&&!k.value)k.value=v.km}
function cc(f,m){if(m=='orders')f.elements.total.value=fmt.m(+f.elements.labor.value+ +f.elements.partsV.value+ +f.elements.other.value-f.elements.disc.value);if(m=='fuelings')f.elements.total.value=fmt.m(f.elements.liters.value*f.elements.price.value)}
function op(m,id){const s=ST[m],r=id?DB[m].find(x=>x.id==id):{},ro=id?!can('e'):!can('c');modal(`<form onsubmit="sv(event,'${m}',${id||0})" oninput="cc(this,'${m}')"><h3>${id?(ro?'Ver':'Editar'):'Novo'} — ${esc(s.t)}${m=='orders'&&id?' · OS-'+pad(id):''}</h3><fieldset class=fg ${ro?'disabled':''} style="margin-top:12px">${s.f.map(f=>fld(f,r)).join('')}</fieldset><div id=at></div><p style="margin-top:14px">${ro?'':'<button class=btn>Salvar</button> '}<button type=button class="btn g" onclick="$('#dlg').close()">Fechar</button></p></form>`);const f=$('#dlg form');cc(f,m);if(id)att(m,id)}
async function sv(e,m,id){e.preventDefault();const s=ST[m],F=new FormData(e.target),old=id?DB[m].find(x=>x.id==id):null,r={};
s.f.forEach(f=>{if(f[2]!='c')r[f[0]]=(F.get(f[0])??'').trim()});
const kv=m=='vehicles'?r.km:(r.kmOs||r.kmF),cur=m=='vehicles'?(old&&old.km):(V(r.vehicle)||{}).km;
if(cur&&kv!==''&&+kv<cur&&!await cf(`O KM informado (${fmt.n(kv)}) é menor que o último registrado (${fmt.n(cur)}). Confirmar mesmo assim?`))return;
try{const j=await api(m+(id?'/'+id:''),{m:id?'PUT':'POST',b:JSON.stringify(r)});DB=j.db;$('#dlg').close();toast('Salvo com sucesso.');render()}catch(x){toast(x.message,1)}}
async function dl(m,id){if(!await cf('Excluir este registro? Esta ação não pode ser desfeita.'))return;try{DB=(await api(m+'/'+id,{m:'DELETE'})).db;toast('Registro excluído.');render()}catch(x){toast(x.message,1)}}
async function att(m,id){const h=$('#at');if(!h)return;try{const l=await api('attachments/'+m+'/'+id);h.innerHTML='<label>Anexos (PDF, JPG ou PNG, até 5 MB)</label>'+l.map(a=>`<p><a href="/api/files/${a.id}" target=_blank>${esc(a.name)}</a> <span class=mut>${fmt.n(Math.round(a.size/1024))} KB</span></p>`).join('')+(can('e')?`<input type=file accept=".pdf,.jpg,.jpeg,.png" onchange="up('${m}',${id},this)">`:'')}catch(x){}}
async function up(m,id,i){const f=i.files[0];if(!f)return;try{const r=await fetch(`/api/attachments/${m}/${id}`,{method:'POST',headers:{'Content-Type':f.type,'X-Requested-With':'frotapro','X-Filename':encodeURIComponent(f.name)},body:f});if(!r.ok)throw new Error((await r.json()).error);toast('Arquivo anexado.');att(m,id)}catch(x){toast(x.message,1)}}
function gs(q){q=q.toLowerCase();const o=$('#gr');if(q.length<2){o.hidden=1;return}let h='';for(const m in ST){if(m=='users'&&me.role!='Administrador')continue;DB[m].filter(r=>Object.entries(r).filter(e=>e[0]!='h').map(e=>e[1]).join(' ').toLowerCase().includes(q)||('os-'+pad(r.id)).includes(q)&&m=='orders').slice(0,4).forEach(r=>h+=`<a onclick="op('${m}',${r.id});$('#gr').hidden=1">${esc(ST[m].t)}: ${esc(r.plate||r.name||r.insurer||r.code||r.doc||r.desc||r.service||'#'+r.id)}</a>`)}o.innerHTML=h||'<a>Nenhum resultado.</a>';o.hidden=0}
function bell(){const A=alerts();modal(`<h3>Notificações</h3>${A.map(a=>`<p><span class="${a.b?'bad':''}">${esc(a.t)}</span> · ${esc(a.x)} — ${a.m}</p>`).join('')||'<p class=mut>Sem notificações.</p>'}<button class=btn onclick="$('#dlg').close()">Fechar</button>`)}
function cfg(){return`<h2>Configurações</h2><div class=card style="margin-top:12px"><p><button class="btn g" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme=='dark'?'light':'dark'">Alternar tema claro/escuro</button></p><p><button class="btn r" onclick="rst()">Restaurar dados de demonstração</button></p><p class=mut>Dados no banco SQLite do servidor, senhas com bcrypt, sessão em cookie HttpOnly e permissões validadas no back-end.</p></div>`}
async function rst(){if(await cf('Apagar todos os dados e recarregar a demonstração?')){try{DB=(await api('reset',{m:'POST'})).db;toast('Dados restaurados.');go('dash')}catch(x){toast(x.message,1)}}}
function audit(){return`<h2>Auditoria</h2><div class="card tw" style="margin-top:12px"><table><tr><th>Data/hora<th>Usuário<th>Ação</tr>${DB.audit.map(a=>`<tr><td>${a.at}<td>${esc(a.u)}<td>${esc(a.t)}</tr>`).join('')||'<tr><td colspan=3 class=mut>Nenhuma operação registrada ainda.</tr>'}</table></div>`}
function go(k,n){location.hash='#/'+k;if(n)setTimeout(()=>op(k),50)}
function tg(){const s=$('#sd');s.classList.toggle(innerWidth<800?'open':'hide')}
function render(){if(!me)return;const k=(location.hash.slice(2)||'dash'),ok=NAV.some(n=>n[0]==k)&&!(k=='users'&&me.role!='Administrador');const K2=ok?k:'dash';
$('#nv').innerHTML=NAV.filter(n=>n[0]!='users'||me.role=='Administrador').map(n=>`<a class="${n[0]==K2?'on':''}" onclick="go('${n[0]}');$('#sd').classList.remove('open')">${n[1]}</a>`).join('');
$('#bc').textContent=alerts().length;$('#view').innerHTML=K2=='dash'?dash():K2=='costs'?costs():K2=='reports'?reports():K2=='audit'?audit():K2=='cfg'?cfg():lst(K2)}
async function login(e){e.preventDefault();const le=$('#le');try{const em=$('#em').value.trim().toLowerCase(),j=await api('login',{m:'POST',b:JSON.stringify({email:em,password:$('#pw').value})});try{$('#rm').checked?localStorage.setItem(K+'_em',em):localStorage.removeItem(K+'_em')}catch(x){}le.textContent='';start(j)}catch(x){le.textContent=x.message}}
function start(j){me=j.user;DB=j.db;$('#login').hidden=1;$('#app').hidden=0;$('#av').textContent=me.name[0];$('#un').textContent=me.name;$('#ur').textContent=me.role;render()}
async function out(){try{await api('logout',{m:'POST'})}catch(x){}me=null;DB=null;$('#app').hidden=1;$('#login').hidden=0;$('#pw').value=''}
addEventListener('hashchange',render);
(async()=>{try{$('#em').value=localStorage.getItem(K+'_em')||'';$('#rm').checked=!!$('#em').value}catch(e){}try{start(await api('me'))}catch(e){}})();
</script></body></html>
